# Copy of the Plesk plan "App website" nginx directives (master: ../web-prod/plans/app-website.nginx.conf).
# The server does not read this file: tools/check-csp.mjs checks the build against it. Changing it: docs/deploy.md.
# Plesk "App website" – security headers for browser apps (bonis.de homepage). Copy of "Astro website" with external APIs, frames and style attributes allowed. Hidden files are blocked; version.txt stays readable.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.stylite-live.de; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://matomo.stylite-live.de; font-src 'self' data:; media-src 'self'; connect-src 'self' https://matomo.stylite-live.de https://api.github.com https://blog.stylite.de; frame-src 'self' https:; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
location ~ /\.(?!well-known) { deny all; }
# Do not reveal server software (Minna 2026-10-23)
proxy_hide_header X-Powered-By;
